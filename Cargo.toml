[package]
name = "timestitch"
version = "0.1"
authors = ["Skylor R Schermer <skyschermer@gmail.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/solarretrace/timestitch-rs"
description = "A journalling and timeline formatting tool"
readme = "readme.md"
keywords = ["journal"]
categories = ["command-line-utilities"]
homepage = "https://github.com/solarretrace/timestitch-rs"
exclude = [
	"*.sublime-project",
	"*.sublime-workspace",
	".kateproject",
]

[lib]
name = "timestitch"

[features]
default = []

# Required dependencies
[dependencies]


# Optional dependencies

# Dependencies used for tests, examples, and benches.
[dev-dependencies]


# The development profile, used for `cargo build`
[profile.dev]
opt-level = 0
debug = true
rpath = false
lto = false
debug-assertions = true
incremental = true
overflow-checks = true

# Development profile overrides, ensure dependent crates run fast.
[profile.dev.package."*"]
opt-level = 3
debug-assertions = false
codegen-units = 1
#strip = "debuginfo"

# The release profile, used for `cargo build --release`
[profile.release]
opt-level = 3
debug = true
rpath = false
lto = "fat"
debug-assertions = false
codegen-units = 1
incremental = false
overflow-checks = true
#strip = "debuginfo"
